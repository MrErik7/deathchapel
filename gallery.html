<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <meta name="description" content="Death Chapel is a Swedish death metal band, formed in the fall of 2021. They are notorious for their satanic and satirical demeanor on stage." />
    <link rel="icon" type="image/x-icon" href="/img/new_logo2.png">
    <title>Death Chapel - Gallery</title>
</head>

<body>
    <!-- Header Section -->
    <header>
        <div class="header-container">
            <nav>
                <a href="gallery.html" class="nav-link active">Gallery</a>
                <a href="index.html" class="logo-link">
                    <img src="img/new_logo.png" alt="Death Chapel logo" class="logo">
                </a>
                <a href="disc.html" class="nav-link">Discography</a>
            </nav>
            <!-- Social Icons -->
            <div class="social-icons">
                <a href="https://www.instagram.com/death_chapel/" target="_blank">
                    <img src="img/social_icons/instagram.png" alt="Instagram">
                </a>
                <a href="https://www.facebook.com/deathchapel666" target="_blank">
                    <img src="img/social_icons/facebook.png" alt="Facebook">
                </a>
                <a href="https://www.youtube.com/@deathchapel" target="_blank">
                    <img src="img/social_icons/youtube.png" alt="YouTube">
                </a>
                <a href="https://www.tiktok.com/@death.chapel" target="_blank">
                    <img src="img/social_icons/tiktok.webp" alt="TikTok">
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Gallery Section -->
        <section id="gallery" class="gallery-section">
            <h2>Gallery</h2>
            <div class="gallery-grid">
                <!-- Gallery Image Objects -->
                <div class="gallery-item">
                    <img src="img/gallery_pics/abyss1.webp" alt="Abyss 1">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/abyss2.webp" alt="Abyss 2">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/bandbild1.webp" alt="Band Picture 1">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/bandbild2_liggande.webp" alt="Band Picture 2 - Landscape">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/bandbild3.webp" alt="Band Picture 3">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/bandbild4.webp" alt="Band Picture 4">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax1.webp" alt="Kristiflax 1">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax2.webp" alt="Kristiflax 2">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax3.webp" alt="Kristiflax 3">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax4.webp" alt="Kristiflax 4">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax5.webp" alt="Kristiflax 5">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/kristiflax6.webp" alt="Kristiflax 6">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/live1.webp" alt="Live 1">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/live2.webp" alt="Live 2">
                </div>
                <div class="gallery-item">
                    <img src="img/gallery_pics/live3.webp" alt="Live 3">
                </div>
            </div>
        </section>
    </main>


</body>

</html>
